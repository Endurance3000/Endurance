<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endurance</title>
  <style>
    /* Material 3 Warm Espresso Palette & Foundations */
    :root {
      --bg-color: #1E1916;
      --border-color: #342920;
      --text-color: #FFFBE9;
      --text-muted: #AA9A8D;
      --track-color: rgba(206, 171, 147, 0.16);
      --accent-color: #CEAB93;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #FFF9F2;
        --border-color: #EADBCF;
        --text-color: #211A16;
        --text-muted: #78695F;
        --track-color: rgba(120, 91, 72, 0.16);
        --accent-color: #785B48;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
      padding: 24px;
      text-align: center;
    }

    .splash-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 12px;
      display: block;
    }

    .splash-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.3;
      color: var(--text-color);
      margin-bottom: 4px;
    }

    .splash-status {
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* Material 3 Indeterminate Linear Progress Indicator */
    .progress-track {
      position: relative;
      width: 160px;
      height: 3px;
      background-color: var(--track-color);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-primary {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background-color: var(--accent-color);
      border-radius: 3px;
      will-change: left, right;
      animation: m3IndeterminatePrimary 2s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }

    .progress-bar-secondary {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background-color: var(--accent-color);
      border-radius: 3px;
      will-change: left, right;
      animation: m3IndeterminateSecondary 2s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
      animation-delay: 1.15s;
    }

    @keyframes m3IndeterminatePrimary {
      0% {
        left: -35%;
        right: 100%;
      }
      60% {
        left: 100%;
        right: -90%;
      }
      100% {
        left: 100%;
        right: -90%;
      }
    }

    @keyframes m3IndeterminateSecondary {
      0% {
        left: -200%;
        right: 100%;
      }
      60% {
        left: 107%;
        right: -8%;
      }
      100% {
        left: 107%;
        right: -8%;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="logo.png" alt="Endurance" class="splash-logo" width="60" height="60" />
    <h1 class="splash-title">Endurance</h1>
    <p class="splash-status">Starting Endurance...</p>
    <div class="progress-track" role="progressbar" aria-label="Loading Endurance">
      <div class="progress-bar-primary"></div>
      <div class="progress-bar-secondary"></div>
    </div>
  </div>
</body>
</html>
