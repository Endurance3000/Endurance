[package]
name = "endurance"
version = "0.1.0"
description = "Endurance Desktop Music Player"
authors = ["Endurance Team"]
edition = "2021"

[lib]
name = "endurance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"
base64 = "0.22"
